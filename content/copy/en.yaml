# English user-facing copy mirror (Build Plan §4.1, D4 V7).
# Runtime TOML source of truth: backend/app/content/copy/en.toml

welcome: "Hello! I'm Anviq, your private coach. Practise before class here, with nobody watching."
ask_language: "Which language would you like to use? Hindi or English?"
language_retry: "Sorry, I didn't catch that. Please say or type 'Hindi' or 'English'."
ask_grade: "Which class do you teach? 1, 2, 3, or mixed?"
grade_retry: "Please tell me 1, 2, 3 or 'mixed'."
consent_notice: |
  Before we go on, about your data:
  • We don't keep recordings of your voice unless you ask us to. We keep the written text of it, and only for 90 days. If you say 'save my recordings', we also keep your first and latest practice recordings, encrypted, for 30 days. Say 'stop saving my recordings' and they are deleted.
  • We keep no information about children. Please don't say children's real names.
  • Only you can see your progress. Institutions see only anonymous averages for groups of 20 or more teachers.
  • You can say 'delete my data' at any time and everything is erased.
  • You can say 'withdraw consent' at any time to take back your agreement.
  Do you agree? Say 'yes'.
consent_withdrawn: "Your consent is withdrawn and reminders are off. What you shared earlier stays stored until you say 'delete my data'. To keep using Anviq, please read this and agree again."
consent_retry: "I need your consent before we begin. Say 'yes' to agree, or 'no' if you'd rather not."
consent_declined: "That's fine. Nothing about you has been kept. If you change your mind, type 'Hello'."
consent_thanks: "Thank you! We can start now."
menu: "What would you like to do? Prepare for tomorrow, practise, reflect on today, or ask a question? Say 'plan', 'rehearse', 'reflect', 'mirror' or 'ask', or just type your question. Say 'help' any time to see the options."
delete_confirm: "Are you sure you want to delete everything? This will also erase your progress. Say 'yes, delete'."
deleted: "All your data has been deleted. Type 'Hello' to come back to Anviq."
delete_cancelled: "Okay, nothing was deleted."
delete_timed_out: "That delete request timed out, so nothing was deleted. Ask again if you still want it."
stopped: "Okay, I won't send reminder messages any more. Write to me whenever you like."
privacy: "Your practice and scores are yours alone. No headmaster, mentor or officer sees your individual work. Institutions see only anonymous averages for 20 or more teachers. Voice recordings are not kept unless you say 'save my recordings'."
help: "I help you prepare tomorrow's lesson, practise with three AI children, reflect on the day, and answer teaching questions from the NISHTHA/NIPUN modules. Say 'delete my data' to erase everything, 'withdraw consent' to take back your agreement, 'save my recordings' or 'stop saving my recordings' to choose whether your practice recordings are kept, 'stop' to pause reminders, or 'privacy' to learn who sees what."
