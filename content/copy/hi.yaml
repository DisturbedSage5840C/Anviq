# Hindi user-facing copy mirror (Build Plan §4.1, D4 V7).
# Runtime TOML source of truth: backend/app/content/copy/hi.toml

welcome: "नमस्ते! मैं Anviq हूँ, आपकी निजी कोच। यहाँ आप कक्षा से पहले अभ्यास कर सकती हैं, बिना किसी के देखे।"
ask_language: "आप किस भाषा में बात करना चाहेंगी? Hindi या English?"
language_retry: "माफ़ कीजिए, समझ नहीं पाई। कृपया 'Hindi' या 'English' लिखिए या बोलिए।"
ask_grade: "आप कौन सी कक्षा पढ़ाती हैं? 1, 2, 3, या मिली-जुली?"
grade_retry: "कृपया 1, 2, 3 या 'मिली-जुली' बताइए।"
consent_notice: |
  आगे बढ़ने से पहले, आपके डेटा के बारे में:
  • जब तक आप न कहें, हम आपकी आवाज़ की रिकॉर्डिंग नहीं रखते। उसका लिखा रूप रखते हैं, और वह भी 90 दिन तक। अगर आप 'रिकॉर्डिंग सेव करो' कहती हैं, तो हम आपके पहले और सबसे नए अभ्यास की रिकॉर्डिंग 30 दिन तक एन्क्रिप्ट करके रखते हैं। 'रिकॉर्डिंग मत सेव करो' कहने पर वे मिटा दी जाती हैं।
  • बच्चों की कोई जानकारी नहीं रखी जाती। कृपया बच्चों के असली नाम न बोलें।
  • आपकी प्रगति सिर्फ़ आप देख सकती हैं। संस्थाओं को सिर्फ़ 20 या उससे ज़्यादा शिक्षकों का गुमनाम औसत दिखता है।
  • आप कभी भी 'मेरा डेटा मिटाओ' बोलकर सब कुछ मिटा सकती हैं।
  • आप कभी भी 'सहमति वापस' बोलकर अपनी सहमति वापस ले सकती हैं।
  क्या आप सहमत हैं? 'हाँ' बोलिए।
consent_withdrawn: "आपकी सहमति वापस ले ली गई है और याद दिलाना बंद है। पहले जो आपने बताया वह तब तक रखा रहेगा जब तक आप 'मेरा डेटा मिटाओ' न बोलें। Anviq इस्तेमाल करते रहने के लिए नीचे पढ़कर फिर से सहमति दीजिए।"
consent_retry: "सब कुछ शुरू करने के लिए मुझे आपकी सहमति चाहिए। सहमत हों तो 'हाँ', नहीं तो 'नहीं' बोलिए।"
consent_declined: "ठीक है, कोई बात नहीं। आपका कुछ भी नहीं रखा गया है। कभी मन बदले तो 'नमस्ते' लिखिए।"
consent_thanks: "धन्यवाद! अब हम शुरू कर सकते हैं।"
menu: "आप क्या करना चाहेंगी? कल की तैयारी, अभ्यास, आज का सोच-विचार, या कोई सवाल? 'प्लान', 'रिहर्सल', 'रिफ्लेक्ट', 'मिरर' या 'सवाल' बोलिए, या सीधे अपना सवाल लिख दीजिए। 'मदद' बोलकर कभी भी विकल्प देख सकती हैं।"
delete_confirm: "क्या आप पक्का सब कुछ मिटाना चाहती हैं? इससे आपकी प्रगति भी मिट जाएगी। 'हाँ, मिटाओ' बोलिए।"
deleted: "आपका सारा डेटा मिटा दिया गया है। Anviq पर फिर से आने के लिए 'नमस्ते' लिखें।"
delete_cancelled: "ठीक है, कुछ नहीं मिटाया गया।"
delete_timed_out: "मिटाने का अनुरोध समय सीमा में पूरा नहीं हुआ, इसलिए कुछ नहीं मिटाया गया। चाहें तो दोबारा कहिए।"
stopped: "ठीक है, अब मैं याद दिलाने के संदेश नहीं भेजूँगी। जब मन करे, खुद लिखिए।"
privacy: "आपके अभ्यास और स्कोर सिर्फ़ आपके हैं। कोई प्रधानाध्यापक, मेंटर या अधिकारी आपका अलग से कुछ नहीं देखता। संस्थाओं को सिर्फ़ 20 या ज़्यादा शिक्षकों का गुमनाम औसत मिलता है। जब तक आप 'रिकॉर्डिंग सेव करो' न कहें, आवाज़ की रिकॉर्डिंग नहीं रखी जाती।"
help: "मैं कल की पढ़ाई की तैयारी, तीन AI बच्चों के साथ अभ्यास, आज के सोच-विचार, और NISHTHA/NIPUN मॉड्यूल्स से पढ़ाने के सवालों के जवाब देने में मदद करती हूँ। 'डेटा मिटाओ' से सब मिटा सकती हैं, 'सहमति वापस' से अपनी सहमति वापस ले सकती हैं, 'रिकॉर्डिंग सेव करो' या 'रिकॉर्डिंग मत सेव करो' से तय कर सकती हैं कि आपके अभ्यास की रिकॉर्डिंग रखी जाए या नहीं, 'बंद करो' से याद दिलाना रोक सकती हैं, 'गोपनीयता' से जान सकती हैं कि कौन क्या देखता है।"
