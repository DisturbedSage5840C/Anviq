        riya_reasoning_hi: "ऊपर 1 और 1 जोड़े तो 2, नीचे 2 और 3 जोड़े तो 5 — 2/5।"
        meena_misconception: "FRAC.ADD_TOP_KEEP_LARGER_BOTTOM"
        meena_answer: "2/3"
        meena_reasoning_hi: "ऊपर 1 और 1 जोड़े तो 2, नीचे बड़ा वाला 3 रखा — 2/3।"
      - problem: "1/3 + 1/4"
        correct_answer: "7/12"
        riya_misconception: "FRAC.ADD_ACROSS"
        riya_answer: "2/7"
        riya_reasoning_hi: "ऊपर 1 और 1 जोड़े तो 2, नीचे 3 और 4 जोड़े तो 7 — 2/7।"
        meena_misconception: "FRAC.ADD_TOP_KEEP_LARGER_BOTTOM"
        meena_answer: "2/4"
        meena_reasoning_hi: "ऊपर 1 और 1 जोड़े तो 2, नीचे बड़ा वाला 4 रखा — 2/4।"
      - problem: "2/3 + 1/6"
        correct_answer: "5/6"
        riya_misconception: "FRAC.ADD_ACROSS"
        riya_answer: "3/9"
        riya_reasoning_hi: "ऊपर 2 और 1 जोड़े तो 3, नीचे 3 और 6 जोड़े तो 9 — 3/9।"
        meena_misconception: "FRAC.ADD_TOP_KEEP_LARGER_BOTTOM"
        meena_answer: "3/6"
        meena_reasoning_hi: "ऊपर 2 और 1 जोड़े तो 3, नीचे बड़ा वाला 6 रखा — 3/6।"

