# Grades 1-3 Numeracy Topic Map with NIPUN LO codes, NISHTHA FLN Course 9 refs, and 3-problem misconception scenario bank (Build Plan §3.3 A, §4.1, D3 V2, D5 V4).
# Runtime topic definitions live in backend/app/content/topics.toml.

topics:
  - id: NUM.G1.ADD.SINGLE
    grade: 1
    title_en: "adding single-digit numbers by counting on"
    title_hi: "एक अंक वाली संख्याओं का जोड़ (आगे गिनकर)"
    nipun_lo: "IL1.6"
    nishtha_ref: "NISHTHA FLN Course 9: Foundational Numeracy, Module 3, §3.1"
    keywords: ["single digit", "count on", "counting on", "एक अंक", "आगे गिन", "छोटा जोड़"]
    scenarios:
      - problem: "5 + 3"
        correct_answer: "8"
        riya_misconception: "ADD.COUNT_ON_INCLUDES_START"
        riya_answer: "7"
        riya_reasoning_hi: "5 से गिना: 5, 6, 7 — इसलिए 7 आया।"
        aman_answer: "8"
        aman_reasoning_hi: "8। पता नहीं, बस आया।"
        meena_hesitation_hi: "उम्म… मुझे उंगलियों पर गिनने दीजिए…"
      - problem: "6 + 2"
        correct_answer: "8"
        riya_misconception: "ADD.COUNT_ON_INCLUDES_START"
        riya_answer: "7"
        riya_reasoning_hi: "6 और 7 — दो बार गिना तो 7 आया।"
        aman_answer: "8"
        aman_reasoning_hi: "8। मैंने मन में जोड़ा।"
        meena_hesitation_hi: "उम्म… 6 के बाद…"
      - problem: "4 + 5"
        correct_answer: "9"
        riya_misconception: "ADD.COUNT_ON_INCLUDES_START"
        riya_answer: "8"
        riya_reasoning_hi: "4 से शुरू करके 5 उंगलियाँ गिनीं: 4, 5, 6, 7, 8।"
        aman_answer: "9"
        aman_reasoning_hi: "9। बस याद था।"
        meena_hesitation_hi: "उम्म… मैं तीलियों से देखूँ?"

  - id: NUM.G2.ADD.REGROUP
    grade: 2
    title_en: "two-digit addition with carrying"
    title_hi: "हासिल वाला जोड़ (दो अंकों का)"
    nipun_lo: "IL2.5"
    nishtha_ref: "NISHTHA FLN Course 9: Foundational Numeracy, Module 3, §3.2"
    keywords: ["add", "addition", "plus", "carry", "carrying", "जोड़", "हासिल", "जमा"]
    scenarios:
      - problem: "47 + 38"
        correct_answer: "85"
        riya_misconception: "ADD.NO_CARRY"
        riya_answer: "75"
        riya_reasoning_hi: "7 और 8 हुआ 15 का 5, और 4 और 3 हुआ 7 — तो 75।"
        meena_misconception: "ADD.CARRY_WRITE_BOTH"
        meena_answer: "715"
        meena_reasoning_hi: "इकाई में 15 लिखा और दहाई में 7 लिखा, तो 715।"
      - problem: "26 + 47"
        correct_answer: "73"
        riya_misconception: "ADD.NO_CARRY"
        riya_answer: "63"
        riya_reasoning_hi: "6 और 7 का 3 लिखा, 2 और 4 जोड़ा तो 6 — 63।"
        meena_misconception: "ADD.CARRY_WRITE_BOTH"
        meena_answer: "613"
        meena_reasoning_hi: "6 और 7 मिलाकर 13, और 2 और 4 मिलाकर 6 — 613।"
      - problem: "58 + 25"
        correct_answer: "83"
        riya_misconception: "ADD.NO_CARRY"
        riya_answer: "73"
        riya_reasoning_hi: "8 और 5 से 3 आया, और 5 और 2 से 7 — 73।"
        meena_misconception: "ADD.CARRY_WRITE_BOTH"
        meena_answer: "713"
        meena_reasoning_hi: "पहले 7 लिखा और फिर 13 लिखा, तो 713।"

  - id: NUM.G2.SUB.REGROUP
    grade: 2
    title_en: "two-digit subtraction with borrowing"
    title_hi: "हासिल वाला घटाना (दो अंकों का)"
    nipun_lo: "IL2.6"
    nishtha_ref: "NISHTHA FLN Course 9: Foundational Numeracy, Module 3, §3.2"
    keywords: ["subtract", "subtraction", "minus", "borrow", "borrowing", "take away", "घटा", "हासिल", "उधार", "बाकी"]
    scenarios:
      - problem: "52 - 17"
        correct_answer: "35"
        riya_misconception: "SUB.SMALLER_FROM_LARGER"
        riya_answer: "45"
        riya_reasoning_hi: "7 में से 2 घटाया तो 5, और 5 में से 1 घटाया तो 4 — 45।"
        meena_misconception: "SUB.BORROW_NO_DECREMENT"
        meena_answer: "45"
        meena_reasoning_hi: "12 में से 7 गया 5, और दहाई में 5 में से 1 गया 4 — 45।"
      - problem: "63 - 29"
        correct_answer: "34"
        riya_misconception: "SUB.SMALLER_FROM_LARGER"
        riya_answer: "46"
        riya_reasoning_hi: "9 में से 3 गया 6, और 6 में से 2 गया 4 — 46।"
        meena_misconception: "SUB.BORROW_NO_DECREMENT"
        meena_answer: "44"
        meena_reasoning_hi: "13 में से 9 गया 4, और 6 में से 2 गया 4 — 44।"
      - problem: "71 - 34"
        correct_answer: "37"
        riya_misconception: "SUB.SMALLER_FROM_LARGER"
        riya_answer: "43"
        riya_reasoning_hi: "4 में से 1 घटाया 3, और 7 में से 3 घटाया 4 — 43।"
        meena_misconception: "SUB.BORROW_NO_DECREMENT"
        meena_answer: "47"
        meena_reasoning_hi: "11 में से 4 गया 7, और 7 में से 3 गया 4 — 47।"

  - id: NUM.G2.SUB.ZERO
    grade: 2
    title_en: "subtraction when there is a zero"
    title_hi: "शून्य वाला घटाना"
    nipun_lo: "IL2.6"
    nishtha_ref: "NISHTHA FLN Course 9: Foundational Numeracy, Module 3, §3.3"
    keywords: ["subtract", "subtraction", "minus", "take away", "घटा", "zero", "शून्य", "ज़ीरो", "जीरो"]
    scenarios:
      - problem: "40 - 17"
        correct_answer: "23"
        riya_misconception: "SUB.ZERO_MINUS_N_IS_N"
        riya_answer: "37"
        riya_reasoning_hi: "0 में से 7 गया तो 7 ही रहा, और 4 में से 1 गया 3 — 37।"
      - problem: "58 - 20"
        correct_answer: "38"
        riya_misconception: "SUB.N_MINUS_ZERO_IS_ZERO"
        riya_answer: "30"
        riya_reasoning_hi: "8 और 0 से 0 हो गया, और 5 में से 2 गया 3 — 30।"
      - problem: "60 - 24"
        correct_answer: "36"
        riya_misconception: "SUB.ZERO_MINUS_N_IS_N"
        riya_answer: "44"
        riya_reasoning_hi: "0 में से 4 पर 4 लिखा, और 6 में से 2 गया 4 — 44।"

  - id: NUM.G1.PV.TWO_DIGIT
    grade: 1
    title_en: "place value and writing two-digit numbers"
    title_hi: "स्थानीय मान और दो अंकों की संख्या लिखना"
    nipun_lo: "IL1.4"
    nishtha_ref: "NISHTHA FLN Course 9: Foundational Numeracy, Module 2, §2.2"
    keywords: ["place value", "tens and ones", "tens", "ones", "write numbers", "स्थानीय मान", "दहाई", "इकाई", "संख्या लिखना"]
    scenarios:
      - problem: "write 52 (बावन)"
        correct_answer: "52"
        riya_misconception: "PV.CONCAT_WRITE"
        riya_answer: "502"
        riya_reasoning_hi: "पचास का 50 और दो का 2, तो 502 लिखा।"
        meena_misconception: "PV.DIGIT_REVERSAL"
        meena_answer: "25"
        meena_reasoning_hi: "दो और पचास में पहले 2 और फिर 5 लिख दिया — 25।"
      - problem: "write 21 (इक्कीस)"
        correct_answer: "21"
        riya_misconception: "PV.CONCAT_WRITE"
        riya_answer: "201"
        riya_reasoning_hi: "बीस का 20 और एक का 1 — 201।"
        meena_misconception: "PV.DIGIT_REVERSAL"
        meena_answer: "12"
        meena_reasoning_hi: "एक और बीस सुनकर 1 और 2 लिख दिया — 12।"
      - problem: "write 46 (छियालीस)"
        correct_answer: "46"
        riya_misconception: "PV.CONCAT_WRITE"
        riya_answer: "406"
        riya_reasoning_hi: "चालीस का 40 और छह का 6 मिलाकर 406।"
        meena_misconception: "PV.DIGIT_REVERSAL"
        meena_answer: "64"
        meena_reasoning_hi: "छह पहले आया तो 6 और 4 — 64।"

  - id: NUM.G1.CMP.TWO_DIGIT
    grade: 1
    title_en: "comparing two-digit numbers"
    title_hi: "दो अंकों की संख्याओं की तुलना"
    nipun_lo: "IL1.5"
    nishtha_ref: "NISHTHA FLN Course 9: Foundational Numeracy, Module 2, §2.3"
    keywords: ["compare", "comparing", "greater", "bigger", "smaller", "तुलना", "बड़ी संख्या", "छोटी संख्या", "बड़ा", "छोटा"]
    scenarios:
      - problem: "compare 39 and 41"
        correct_answer: "41"
        riya_misconception: "CMP.ONES_DIGIT_DECIDES"
        riya_answer: "39"
        riya_reasoning_hi: "39 में 9 है और 41 में 1 है, 9 बड़ा होता है इसलिए 39 बड़ा है।"
      - problem: "compare 28 and 51"
        correct_answer: "51"
        riya_misconception: "CMP.ONES_DIGIT_DECIDES"
        riya_answer: "28"
        riya_reasoning_hi: "8 तो 1 से बड़ा है, इसलिए 28 बड़ा है।"
      - problem: "compare 19 and 32"
        correct_answer: "32"
        riya_misconception: "CMP.ONES_DIGIT_DECIDES"
        riya_answer: "19"
        riya_reasoning_hi: "19 के आखिर में 9 है जो 2 से बड़ा है, तो 19 बड़ा हुआ।"

  - id: NUM.G3.WP.COMPARE
    grade: 3
    title_en: "word problems with 'more than'"
    title_hi: "'से ज़्यादा' वाले कहानी के सवाल"
    nipun_lo: "IL3.6"
    nishtha_ref: "NISHTHA FLN Course 9: Foundational Numeracy, Module 4, §4.2"
    keywords: ["word problem", "story problem", "more than", "कहानी", "शब्द समस्या", "से ज़्यादा", "से ज्यादा", "से अधिक"]
    scenarios:
      - problem: "Ravi has 18 marbles. Ravi has 5 more than Sita. How many does Sita have?"
        correct_answer: "13"
        riya_misconception: "WP.KEYWORD_MORE_MEANS_ADD"
        riya_answer: "23"
        riya_reasoning_hi: "सवाल में '5 ज़्यादा' लिखा है, इसलिए 18 में 5 जोड़कर 23 आया।"
      - problem: "Asha has 24 mangoes. She has 7 more than Raju. How many does Raju have?"
        correct_answer: "17"
        riya_misconception: "WP.KEYWORD_MORE_MEANS_ADD"
        riya_answer: "31"
        riya_reasoning_hi: "'ज़्यादा' मतलब जोड़ना, तो 24 और 7 जोड़कर 31।"
      - problem: "Mohan read 15 pages. That is 4 more than Geeta. How many pages did Geeta read?"
        correct_answer: "11"
        riya_misconception: "WP.KEYWORD_MORE_MEANS_ADD"
        riya_answer: "19"
        riya_reasoning_hi: "4 ज़्यादा बोला है तो 15 जमा 4 बराबर 19।"
