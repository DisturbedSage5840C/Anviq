# Always-on demo stack: Caddy (free HTTPS) -> API, plus worker, Postgres+pgvector and Redis.
# Run from the repo root:
#   docker compose --env-file infra/demo.env -f infra/docker-compose.demo.yml up -d --build
# Only Caddy publishes ports to the world; the database and Redis are reachable inside the stack
# alone. (The optional evolution profile also binds 127.0.0.1:8081 on this machine, for pairing.)

x-backend: &backend
  build:
    context: ../backend
  image: anviq-backend:demo
  restart: unless-stopped
  environment: &app-env
    - APP_ENV=staging
    - DATABASE_URL=postgresql+asyncpg://app_rw:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@postgres:5432/anviq
    - REDIS_URL=redis://redis:6379/0
    - WA_VERIFY_TOKEN=${WA_VERIFY_TOKEN:?set WA_VERIFY_TOKEN}
    - WA_APP_SECRET=${WA_APP_SECRET:?set WA_APP_SECRET}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}
    - STT_PROVIDER
    - TTS_PROVIDER
    - GOOGLE_SPEECH_API_KEY
    - SARVAM_API_KEY
    - SARVAM_TTS_MODEL
    - MODEL_FAST
    - MODEL_SMART
    - MODEL_OFFLINE
    - FIELD_KEY=${FIELD_KEY:?set FIELD_KEY}
    - PHONE_PEPPER=${PHONE_PEPPER:?set PHONE_PEPPER}
    - WEB_ALLOWED_ORIGINS
    - DEMO_CYCLE_MINUTES
    - WA_PHONE_NUMBER_ID
    - WA_ACCESS_TOKEN
    - WHATSAPP_PROVIDER
    - TWILIO_ACCOUNT_SID
    - TWILIO_AUTH_TOKEN
    - TWILIO_WHATSAPP_FROM
    - TWILIO_WEBHOOK_URL
    - EVOLUTION_BASE_URL
    - EVOLUTION_API_KEY
    - EVOLUTION_INSTANCE
    - EVOLUTION_WEBHOOK_SECRET
  depends_on:
    db-roles:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: anviq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: anviq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anviq"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    restart: "no"
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://anviq:${POSTGRES_PASSWORD}@postgres:5432/anviq
    depends_on:
      postgres:
        condition: service_healthy

  db-roles:
    image: pgvector/pgvector:pg16
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ['psql -v ON_ERROR_STOP=1 -h postgres -U anviq -d anviq -v pw="$$APP_DB_PASSWORD" -f /app-role.sql']
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./demo/app-role.sql:/app-role.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *backend
    networks: [default, evolution]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    <<: *backend
    networks: [default, evolution]
    command: ["uv", "run", "--no-sync", "arq", "app.worker.WorkerSettings"]

  # --- optional WhatsApp channel: Evolution API on a spare SIM (demo only, breaks WhatsApp's terms) ---
  # Start it with:  docker compose --profile evolution ... up -d
  # Its database is separate from the teacher data, and its port is reachable from this machine
  # only (for pairing); the backend reaches it inside the stack, and it posts webhooks back to api.
  # It sits on its own `evolution` network (shared only with api and worker), so this third-party
  # image cannot reach the teacher Postgres or Redis.
  # `${VAR:?}` would also stop the stack for anyone not using Evolution (Compose checks every
  # service, profile or not), so this one-shot check fails the profile instead when a secret is empty.
  evolution-guard:
    profiles: ["evolution"]
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["sh", "-c"]
    command: ['test -n "$$EVOLUTION_API_KEY" && test -n "$$EVOLUTION_DB_PASSWORD" || { echo "Set EVOLUTION_API_KEY and EVOLUTION_DB_PASSWORD in infra/demo.env" >&2; exit 1; }']
    environment:
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:-}

  evolution-db:
    profiles: ["evolution"]
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [evolution]
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-}
      POSTGRES_DB: evolution
    depends_on:
      evolution-guard:
        condition: service_completed_successfully
    volumes:
      - evolutiondbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 3s
      retries: 10

  evolution:
    profiles: ["evolution"]
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    networks: [evolution]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-}@evolution-db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: anviq
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # Voice notes are fetched by message id, so Evolution has to keep the message.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "false"
      # Keep message text out of the container logs.
      LOG_LEVEL: ERROR,WARN
    volumes:
      - evolutioninstances:/evolution/instances
    depends_on:
      evolution-guard:
        condition: service_completed_successfully
      evolution-db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS
    volumes:
      - ./demo/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web-room:/srv/room:ro
      - caddydata:/data
    depends_on:
      api:
        condition: service_healthy

networks:
  evolution:

volumes:
  pgdata:
  redisdata:
  caddydata:
  evolutiondbdata:
  evolutioninstances:
