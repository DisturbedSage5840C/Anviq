# Mumbai (bom). App name is overridden per environment: -a anviq-staging / anviq-prod.
# Secrets are set with `fly secrets set` and never live in this file.
# Deploy from backend/ so the Docker build context is the backend directory:
#   cd backend && fly deploy --config ../infra/fly.toml --dockerfile Dockerfile
app = "anviq-staging"
primary_region = "bom"

[deploy]
  release_command = "uv run --no-sync alembic upgrade head"

[env]
  APP_ENV = "staging"

[processes]
  api = "uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8080"
  worker = "uv run --no-sync arq app.worker.WorkerSettings"

[http_service]
  processes = ["api"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  processes = ["api"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
