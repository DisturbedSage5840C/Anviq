# Mumbai (bom). App name is overridden per environment: -a anviq-staging / anviq-prod.
# Secrets are set with `fly secrets set` and never live in this file.
app = "anviq-staging"
primary_region = "bom"

[build]
  dockerfile = "../backend/Dockerfile"

[deploy]
  release_command = "uv run --no-sync alembic upgrade head"

[env]
  APP_ENV = "staging"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
