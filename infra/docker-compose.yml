# Local dev only. Credentials here are throwaway and never used outside your laptop.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: anviq
      POSTGRES_PASSWORD: anviq
      POSTGRES_DB: anviq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anviq"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
