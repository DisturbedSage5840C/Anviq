name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: anviq
          POSTGRES_PASSWORD: anviq
          POSTGRES_DB: anviq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anviq" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      WA_VERIFY_TOKEN: ci-verify-token
      WA_APP_SECRET: ci-app-secret
      DATABASE_URL: postgresql+asyncpg://anviq:anviq@localhost:5432/anviq
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
        working-directory: .
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pip-audit --skip-editable
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=app --cov-fail-under=80
      # The cores that carry the privacy promises must each clear the bar on their own, so strong
      # coverage elsewhere cannot hide a gap in them.
      - run: |
          for package in core privacy guardrails; do
            uv run coverage report --include="app/$package/*" --fail-under=80
          done

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Node ships on the runner; building proves the type check and static export still pass.
      - run: npm ci
      - run: npm run build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
