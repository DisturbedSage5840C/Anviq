name: deploy

# Off until the repo variable DEPLOY_ENABLED is "true" and the FLY_API_TOKEN secret exists,
# so a fresh fork never goes red on a missing token.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --config ../infra/fly.toml --dockerfile Dockerfile --remote-only -a anviq-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
