name: deploy

# Off until the repo variable DEPLOY_ENABLED is "true" and the FLY_API_TOKEN secret exists,
# so a fresh fork never goes red on a missing token.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # workflow_run executes with secrets, so only deploy CI runs that came from a push to this
    # repo's own main branch, never from a fork or a pull request.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: flyctl deploy --config ../infra/fly.toml --dockerfile Dockerfile --remote-only -a anviq-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  production:
    # A release is a `v*` tag. The job waits for a reviewer on the `production` environment
    # (Settings > Environments > production > Required reviewers), which also holds the prod-only
    # FLY_API_TOKEN, so nobody deploys the real number's backend by pushing a tag alone.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Only commits that already went through CI on main may ship: a tag on a side branch fails.
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - run: >-
          flyctl deploy --config ../infra/fly.toml --dockerfile Dockerfile --remote-only
          -a anviq-prod --env APP_ENV=prod
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
