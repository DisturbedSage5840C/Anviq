[project]
name = "anviq-backend"
version = "0.1.0"
description = "Anviq: private WhatsApp voice coach for Grade 1-3 FLN teachers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "arq>=0.26",
  "httpx>=0.27",
  "cryptography>=50.0.2",
  "redis>=5.3.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "respx>=0.23.1",
  "fakeredis>=2.40.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
"tests/db/*" = ["S608"]  # table names come from module constants, never input

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
