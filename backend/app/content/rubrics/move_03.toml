[[criteria]]
id = "C1"
text = "When the child hesitates, the teacher does not supply the answer or do the step for them."

[[criteria]]
id = "C2"
text = "Gives encouragement or wait language (take your time, think calmly)."

[[criteria]]
id = "C3"
text = "Offers a smaller hint or a smaller step, not the solution."

