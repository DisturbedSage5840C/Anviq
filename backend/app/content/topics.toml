# Numeracy topics for Grades 1-3 that Anviq can plan and rehearse (plan sections 3.3 A, 4.6).
# Every topic here has at least one executable misconception in core/children/malrules.
#
# Reviewed by Vansh: NIPUN Bharat learning-outcome codes (IL / Lakshya Class 1-3) and
# NISHTHA FLN Course 9 (Foundational Numeracy) module/section references are mapped below.
#
# `keywords` are matched as plain text in what the teacher said. ASCII keywords match at the start
# of a word; Hindi keywords match anywhere in a word because Hindi inflects (घटा, घटाना, घटाओ).

